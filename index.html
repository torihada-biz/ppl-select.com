<title>Beauty Trio Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap">
<style id="page-style">
  :root {
    --bg: #FFF6FA;
    --surface: #FFFFFF;
    --surface-alt: #F7EBFA;
    --border: #F0D9EE;
    --frame-border: #E0B9DE;
    --ink: #2B1E33;
    --ink-soft: #6E5A78;
    --ink-faint: #A692AE;
    --accent: #FF6F91;
    --accent-2: #8B5CF6;
    --accent-gradient: linear-gradient(120deg, #FF6F91, #B15CE0 55%, #8B5CF6);
    --accent-deep: #7A3FC2;
    --shadow: rgba(139, 45, 120, 0.14);
    color-scheme: light;
  }
  /* Intentionally no dark-mode override: this page keeps one fixed brand
     look for every viewer, regardless of their system/browser theme. */

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 1080px; margin: 0 auto; padding: 56px 24px 72px; display: flex; flex-direction: column; gap: 40px; }

  header { position: relative; text-align: center; padding-bottom: 8px; }
  header::before {
    content: ""; position: absolute; top: -60px; left: 50%; width: 480px; height: 260px;
    transform: translateX(-50%); background: var(--accent-gradient); opacity: 0.20;
    filter: blur(60px); border-radius: 50%; pointer-events: none; z-index: -1;
  }
  .eyebrow {
    font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 500;
    letter-spacing: 0.24em; color: var(--accent-deep); text-transform: uppercase;
  }
  h1 {
    font-size: clamp(22px, 4vw, 32px); font-weight: 900; margin: 10px 0 0;
    background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text;
    color: transparent; letter-spacing: 0.01em; text-wrap: balance;
  }

  .brand-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  @media (max-width: 780px) { .brand-grid { grid-template-columns: 1fr; } }

  .brand-slot {
    display: flex; flex-direction: column; gap: 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
    padding: 22px; box-shadow: 0 2px 12px var(--shadow);
  }

  .slot { position: relative; }

  .logo-slot {
    display: flex; align-items: center; justify-content: center;
    height: 88px; width: 100%; flex: 0 0 88px; box-sizing: border-box; padding: 14px;
    border-radius: 14px; background: var(--surface-alt); border: 1.5px dashed var(--frame-border);
    cursor: pointer; overflow: hidden; transition: border-color .15s ease;
  }
  .logo-slot:hover { border-color: var(--accent); }
  .logo-slot.has-image { border-style: solid; }
  .logo-slot img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .logo-slot .wordmark { font-weight: 900; font-size: 20px; letter-spacing: 0.02em; color: var(--ink); text-transform: uppercase; }
  .logo-slot .logo-hint {
    display: block; margin-top: 3px; font-family: "JetBrains Mono", monospace; font-size: 9.5px;
    letter-spacing: 0.1em; color: var(--ink-faint); text-align: center; text-transform: uppercase;
  }

  .image-slot {
    position: relative; aspect-ratio: 1 / 1; border-radius: 16px; border: 1.5px dashed var(--frame-border);
    background: repeating-linear-gradient(135deg, var(--surface-alt) 0 10px, var(--surface) 10px 20px);
    display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden;
    transition: border-color .15s ease; text-decoration: none; color: inherit;
  }
  .image-slot:hover { border-color: var(--accent); }
  .image-slot.has-image { border-style: solid; cursor: pointer; }
  .image-slot img { width: 100%; height: 100%; object-fit: contain; padding: 8px; display: block; }
  .image-slot-inner { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ink-faint); pointer-events: none; }
  .image-slot-inner svg { width: 32px; height: 32px; opacity: 0.7; }
  .image-slot-inner span { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .image-slot-inner small { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: 0.04em; }

  .image-slot-remove {
    position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%;
    border: none; background: rgba(0,0,0,0.55); color: #fff; display: none;
    align-items: center; justify-content: center; cursor: pointer; font-size: 14px; line-height: 1; z-index: 2;
  }
  .image-slot.has-image .image-slot-remove { display: flex; }
  .image-slot-remove:hover { background: rgba(0,0,0,0.75); }

  .go-badge {
    position: absolute; bottom: 8px; left: 8px; padding: 5px 11px; border-radius: 999px;
    background: var(--accent-gradient); color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; gap: 4px; letter-spacing: .02em; z-index: 1;
  }

  footer { text-align: center; font-size: 11.5px; color: var(--ink-faint); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 120%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: 13px; transition: transform .25s ease; z-index: 50; white-space: nowrap;
  }
  .toast.show { transform: translate(-50%, 0); }
</style>

  function showToast(msg){

  function loadImage(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function(){
        var img = new Image();
        img.onerror = reject;
        img.onload = function(){ resolve(img); };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // Finds the bounding box of the actual logo mark inside an image, ignoring
  // a transparent or flat-color border — so a logo file with lots of built-in
  // whitespace doesn't render smaller than one that's tightly cropped.
  function findContentBounds(ctx, w, h){
    var data;
    try { data = ctx.getImageData(0, 0, w, h).data; } catch (e) { return null; }
    function px(x, y){ var i = (y * w + x) * 4; return [data[i], data[i+1], data[i+2], data[i+3]]; }
    var corners = [px(0,0), px(w-1,0), px(0,h-1), px(w-1,h-1)];
    var bg = [0,0,0], bgA = 0;
    corners.forEach(function(c){ bg[0]+=c[0]; bg[1]+=c[1]; bg[2]+=c[2]; bgA+=c[3]; });
    bg[0]/=4; bg[1]/=4; bg[2]/=4; bgA/=4;
    var bgTransparent = bgA < 8;
    var THRESH = 20;
    var minX=w, minY=h, maxX=-1, maxY=-1;
    for (var y=0;y<h;y++){
      for (var x=0;x<w;x++){
        var i=(y*w+x)*4;
        var a = data[i+3];
        var isContent;
        if (a < 8){ isContent = false; }
        else if (bgTransparent){ isContent = true; }
        else {
          var dr=data[i]-bg[0], dg=data[i+1]-bg[1], db=data[i+2]-bg[2];
          isContent = Math.sqrt(dr*dr+dg*dg+db*db) > THRESH;
        }
        if (isContent){
          if (x<minX) minX=x; if (x>maxX) maxX=x;
          if (y<minY) minY=y; if (y>maxY) maxY=y;
        }
      }
    }
    if (maxX < 0) return null;
    return { x:minX, y:minY, w:maxX-minX+1, h:maxY-minY+1 };
  }

  function resizeImage(file, maxDim, mime, quality, autoCrop){
    return loadImage(file).then(function(img){
      var srcX = 0, srcY = 0, srcW = img.width, srcH = img.height;

      if (autoCrop){
        var aScale = Math.min(1, 500 / Math.max(img.width, img.height));
        var aw = Math.max(1, Math.round(img.width * aScale));
        var ah = Math.max(1, Math.round(img.height * aScale));
        var analyzeCanvas = document.createElement("canvas");
        analyzeCanvas.width = aw; analyzeCanvas.height = ah;
        var actx = analyzeCanvas.getContext("2d");
        actx.drawImage(img, 0, 0, aw, ah);
        var bounds = findContentBounds(actx, aw, ah);
        if (bounds && (bounds.w < aw * 0.96 || bounds.h < ah * 0.96)){
          var pad = Math.round(Math.max(bounds.w, bounds.h) * 0.08);
          var bx = Math.max(0, bounds.x - pad);
          var by = Math.max(0, bounds.y - pad);
          var bx2 = Math.min(aw, bounds.x + bounds.w + pad);
          var by2 = Math.min(ah, bounds.y + bounds.h + pad);
          var scaleBack = img.width / aw;
          srcX = Math.round(bx * scaleBack);
          srcY = Math.round(by * scaleBack);
          srcW = Math.round((bx2 - bx) * scaleBack);
          srcH = Math.round((by2 - by) * scaleBack);
        }
      }

      var scale = Math.min(1, maxDim / Math.max(srcW, srcH));
      var w = Math.max(1, Math.round(srcW * scale));
      var h = Math.max(1, Math.round(srcH * scale));
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, w, h);
      return canvas.toDataURL(mime, quality);
    });
  }

  function handleFile(imgKey, file){
    if (!file || !/^image\//.test(file.type)) return;
    var isLogo = /_logo$/.test(imgKey);
    var hasAlpha = file.type === "image/png" || file.type === "image/webp" || file.type === "image/gif";
    var mime = isLogo && hasAlpha ? "image/png" : "image/jpeg";
    var maxDim = isLogo ? 800 : 1600;
    resizeImage(file, maxDim, mime, 0.86, isLogo).then(function(dataUrl){
      state.images[imgKey] = dataUrl;
      render();
      scheduleSave();
    }).catch(function(){
      showToast("画像の読み込みに失敗しました");
    });
  }

      stateTag + '\n' +
      '<input type="file" id="file-input" accept="image/*" style="display:none">\n' +
      scriptTag + "\n</body>\n</html>";
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 700);
  }

  function doSave(){
    if (!artifactCap){
      showToast("この端末にのみ反映されています(保存機能が利用できません)");
      return;
    }
    artifactCap.publish(buildFullHTML()).then(function(){
      showToast("保存しました");

      var code = err && err.code;

        writable = false;

        return;

      showToast("保存に失敗しました。時間を置いて再度お試しください");
    });
  }

      var isFilledProduct = addTarget.classList.contains("has-image") && addTarget.tagName === "A";
      if (isFilledProduct) return; // let the click open the Qoo10 link instead of re-upload
      if (!writable) return;
      e.preventDefault();
      pendingKey = key;
      document.getElementById("file-input").click();
    }
  });

  document.getElementById("file-input").addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0];
    var key = pendingKey;
    e.target.value = "";
    if (file && key) handleFile(key, file);
  });

  render();

  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(cap){
      artifactCap = cap;
    }).catch(function(){ artifactCap = null; });
  }
})();
</script>
