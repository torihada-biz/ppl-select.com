<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beauty Trio Select</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap">
<style id="page-style">
  :root {
    --bg: #FFF6FA;
    --surface: #FFFFFF;
    --surface-alt: #F7EBFA;
    --border: #F0D9EE;
    --frame-border: #E0B9DE;
    --ink: #2B1E33;
    --ink-soft: #6E5A78;
    --ink-faint: #A692AE;
    --accent: #FF6F91;
    --accent-2: #8B5CF6;
    --accent-gradient: linear-gradient(120deg, #FF6F91, #B15CE0 55%, #8B5CF6);
    --accent-deep: #7A3FC2;
    --shadow: rgba(139, 45, 120, 0.14);
    color-scheme: light;
  }
  /* Intentionally no dark-mode override: this page keeps one fixed brand
     look for every viewer, regardless of their system/browser theme. */

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page { max-width: 1080px; margin: 0 auto; padding: 56px 24px 72px; display: flex; flex-direction: column; gap: 40px; }

  header { position: relative; text-align: center; padding-bottom: 8px; }
  header::before {
    content: ""; position: absolute; top: -60px; left: 50%; width: 480px; height: 260px;
    transform: translateX(-50%); background: var(--accent-gradient); opacity: 0.20;
    filter: blur(60px); border-radius: 50%; pointer-events: none; z-index: -1;
  }
  .eyebrow {
    font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 500;
    letter-spacing: 0.24em; color: var(--accent-deep); text-transform: uppercase;
  }
  h1 {
    font-size: clamp(22px, 4vw, 32px); font-weight: 900; margin: 10px 0 0;
    background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text;
    color: transparent; letter-spacing: 0.01em; text-wrap: balance;
  }

  .brand-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  @media (max-width: 780px) { .brand-grid { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; width: 100%; } }

  .brand-slot {
    display: flex; flex-direction: column; gap: 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
    padding: 22px; box-shadow: 0 2px 12px var(--shadow);
    min-width: 0;
  }

  .slot { position: relative; display: block; }

  .logo-slot {
    display: flex; align-items: center; justify-content: center;
    height: 88px; width: 100%; flex: 0 0 88px; box-sizing: border-box; padding: 14px;
    border-radius: 14px; background: var(--surface); border: 1.5px solid var(--border);
    overflow: hidden;
  }
  .logo-slot img { width: 100%; height: 100%; object-fit: contain; display: block; }

  .image-slot {
    position: relative; aspect-ratio: 1 / 1; width: 100%; border-radius: 16px; border: 1.5px solid var(--border);
    background: var(--surface); display: block; overflow: hidden;
    transition: border-color .15s ease; text-decoration: none; color: inherit;
  }
  .image-slot:hover, .image-slot:focus-visible { border-color: var(--accent); }
  .image-slot img { width: 100%; height: 100%; object-fit: contain; padding: 8px; display: block; }

  .go-badge {
    position: absolute; bottom: 8px; left: 8px; padding: 5px 11px; border-radius: 999px;
    background: var(--accent-gradient); color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; gap: 4px; letter-spacing: .02em; z-index: 1;
  }

  footer { text-align: center; font-size: 11.5px; color: var(--ink-faint); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 120%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: 13px; transition: transform .25s ease; z-index: 50; white-space: nowrap;
  }
  .toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="eyebrow">Brand Showcase</div>
    <h1>KOPHER &times; Anua &times; medicube</h1>
  </header>
  <div class="brand-grid">
    <div class="brand-slot">
      <div class="slot logo-slot">
        <img src="images/kopher_logo.webp" alt="KOPHER ロゴ" width="280" height="88" loading="eager">
      </div>
      <a class="slot image-slot" href="https://www.qoo10.jp/g/1026151513" target="_blank" rel="noopener">
        <img src="images/kopher_product.webp" alt="KOPHER 商品画像" width="640" height="640" loading="eager">
        <span class="go-badge">詳しく見る</span>
      </a>
    </div>
    <div class="brand-slot">
      <div class="slot logo-slot">
        <img src="images/anua_logo.webp" alt="Anua ロゴ" width="280" height="88" loading="lazy">
      </div>
      <a class="slot image-slot" href="https://www.qoo10.jp/g/983103404" target="_blank" rel="noopener">
        <img src="images/anua_product.webp" alt="Anua 商品画像" width="640" height="640" loading="lazy">
        <span class="go-badge">詳しく見る</span>
      </a>
    </div>
    <div class="brand-slot">
      <div class="slot logo-slot">
        <img src="images/medicube_logo.webp" alt="medicube ロゴ" width="280" height="88" loading="lazy">
      </div>
      <a class="slot image-slot" href="https://www.qoo10.jp/g/1194260755" target="_blank" rel="noopener">
        <img src="images/medicube_product.webp" alt="medicube 商品画像" width="640" height="640" loading="lazy">
        <span class="go-badge">詳しく見る</span>
      </a>
    </div>
  </div>
</div>
</body>
</html>
